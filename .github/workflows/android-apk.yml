name: Build Android APK

# Every pushed commit builds an APK. Website changes still require publishing in Lovable,
# because both the phone and browser load the same published screens.
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: bun install --frozen-lockfile || bun install

      - name: Copy app settings into the Android project
        run: bunx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check the APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/WinLog-${{ github.run_number }}.apk"
          # Same name every time, so .../releases/latest/download/WinLog.apk always gets the newest build.
          cp android/app/build/outputs/apk/release/app-release.apk out/WinLog.apk

      - name: Keep APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: WinLog-${{ github.run_number }}
          path: out/*.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WinLog build ${{ github.run_number }}
          body: |
            Install on each company phone: download the APK below, open it, and allow "Install unknown apps" if asked.
            Updates install over the previous version.
          files: out/*.apk
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
