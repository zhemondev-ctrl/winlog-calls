<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WinLog</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f1ea; color: #1c1a17; text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #5f5a52; }
      button { font: inherit; border: 0; border-radius: 999px; padding: 12px 22px; background: #1c1a17; color: #f4f1ea; }
    </style>
  </head>
  <body>
    <div>
      <h1>No internet connection</h1>
      <p>WinLog needs the internet to upload your calls. Your calls are kept on the phone until then.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
